# 桌游平台线上部署编排
# 端口：前端 5000 / 后端 5050 / MySQL 4768
# 首次启动：docker compose up -d --build
#
# 说明：MySQL 仅在数据卷为空（首次启动）时执行 docker/mysql/init.sql。
#       后续如需重置数据库：docker compose down -v 后重新启动。

services:
  mysql:
    image: mysql:8.0
    container_name: luoyin-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-boardgame}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "${MYSQL_PORT:-4768}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 初始化脚本：仅在数据卷为空时执行
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: luoyin-backend
    restart: unless-stopped
    environment:
      PORT: 5050
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-root}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      DB_NAME: ${MYSQL_DATABASE:-boardgame}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${BACKEND_PORT:-5050}:5050"
    volumes:
      # 管理后台上传的图片持久化到宿主机
      - ./server/public/images:/app/public/images
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5050/api/games || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: luoyin-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5000}:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  mysql_data:
